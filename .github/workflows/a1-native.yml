name: FastChat A1 and C67 native candidate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  a1-apk:
    name: ${{ matrix.target }} native APK
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: a1
            abi: armeabi-v7a
          - target: c67
            abi: arm64-v8a
          - target: emulator
            abi: x86_64
    timeout-minutes: 120
    env:
      ASAN_OPTIONS: detect_leaks=0
      CHARCOAL_GREASE: ${{ github.workspace }}/grease/_bin/cxx-asan/ysh
      ANDROID_VERSION_CODE: '7'
      ANDROID_VERSION_NAME: '0.7-native-material-candidate'
      ANDROID_MIN_SDK: '26'
      ANDROID_TARGET_SDK: '34'
      ANDROID_KEYSTORE_TYPE: JKS
      ANDROID_KEY_ALIAS: fastchat-material3-dev
      ANDROID_STORE_PASSWORD: fastchat-development
      ANDROID_KEY_PASSWORD: fastchat-development
      ANDROID_EXPECTED_CERT_SHA256: aa9151e3922fa4795987c3655bc7aa4712620f1d94c24a2075acd7b29d8ac86e
      ANDROID_PACKAGE_ID: org.isomorphisms.fastchat.diskstreaming.arena
    steps:
      - name: Exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Current Grease implementation runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          merge-multiple: true
          github-token: ${{ github.token }}
          path: grease
      - name: Runtime file modes
        run: chmod +x grease/_bin/cxx-asan/ysh
      - name: Exact Grease identity
        run: echo '7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c  grease/_bin/cxx-asan/ysh' | sha256sum -c -
      - name: ASAN producer mapping
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Producer compiler runtime dependencies
        run: sudo apt-get update
      - name: Matching GNU ARM assembler
        run: sudo apt-get install -y binutils-arm-linux-gnueabi binutils-aarch64-linux-gnu libgmp10 libmpfr6 libmpc3 libisl23 libzstd1 ripgrep
      - name: Pinned Icky Lua source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/lua
          ref: 87306483cec50f8c750a22dda1d0742246fad756
          path: icky-lua
          persist-credentials: false
      - name: Pinned NativeActivity packager
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/android-NDK
          ref: 3e682fb1175beef5625dbd2418730220e49fc9bd
          path: packaging
          persist-credentials: false
      - name: Producer SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: ''
      - name: Exact SDK and NDK
        run: sdkmanager 'ndk;29.0.14206865' 'build-tools;34.0.0' 'platforms;android-34'
      - name: Qualified division-capable ICK C producer
        id: ick
        uses: isomorphisms/ai-ci/ick-android@015cc7901ae0b3ad262b476f24e129b53c56db95
        with:
          abi: ${{ matrix.abi }}
          ndk: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
      - name: Locate the exact C frontend and declared assembler
        run: |
          echo "ICK_SUPPORT=$(dirname "$("${{ steps.ick.outputs.compiler }}" -print-prog-name=cc1)")" >> "$GITHUB_ENV"
          ln -sfn "/usr/bin/${{ steps.ick.outputs.gnu_target }}-as" "$(dirname "$("${{ steps.ick.outputs.compiler }}" -print-prog-name=cc1)")/as"
      - name: Pinned foreign build generator
        run: python3 -m pip install cmake==4.4.0
      - name: Exact HTTP2 dependency sources
        run: grease/_bin/cxx-asan/ysh _/transport/fetch.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/http2-sources" 2
      - name: HTTP2 C dependencies through ICK, platform feature-probe link
        run: >
          grease/_bin/cxx-asan/ysh scripts/build-http2-libraries.grease
          "$GITHUB_WORKSPACE/http2-sources" "$GITHUB_WORKSPACE/http2"
          "$ANDROID_HOME/ndk/29.0.14206865" "${{ matrix.target }}" "$(command -v cmake)"
          "${{ steps.ick.outputs.compiler }}" "${{ env.ICK_SUPPORT }}"
      - name: ICK C and Icky Lua runtime; platform link
        run: >
          grease/_bin/cxx-asan/ysh scripts/build-native.grease
          "${{ steps.ick.outputs.compiler }}" "${{ env.ICK_SUPPORT }}" "$ANDROID_HOME/ndk/29.0.14206865" icky-lua native "$GITHUB_WORKSPACE/http2/prefix" "${{ matrix.abi }}"
      - name: Repeat native production and stable signer packaging
        run: >
          env ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          ANDROID_KEYSTORE="$GITHUB_WORKSPACE/android/signing/fastchat-comparison-dev.jks"
          ANDROID_SOURCE_COMMIT="${{ github.event.pull_request.head.sha || github.sha }}"
          FC_GREASE="$GITHUB_WORKSPACE/grease/_bin/cxx-asan/ysh"
          grease/_bin/cxx-asan/ysh scripts/qualify-reproducibility.grease
          "${{ steps.ick.outputs.compiler }}" "${{ env.ICK_SUPPORT }}" "$ANDROID_HOME/ndk/29.0.14206865" icky-lua "$GITHUB_WORKSPACE/http2/prefix"
          packaging native/libfastchat.so native-repeat fastchat.apk "${{ matrix.abi }}"
      - name: Preserve stripped artifact and producer receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.target }}-convergence-apk-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: |
            fastchat.apk
            fastchat.receipt.tsv
            fastchat.apk.packaging-digests.txt
            fastchat.apk.packaging-identity.tsv
            native/native-abi.txt
            native/native-digests.txt
            native/native-sizes.txt
            native/linker-identity.txt
            native/assembler-identity.txt
            native/source-binding.tsv
            http2/foreign-compiler.txt
            http2/foreign-digests.txt
            http2/ick-platform.cmake
            native-repeat/reproducibility-digests.txt

  native-ui-art:
    name: Independent native UI API ${{ matrix.api }}
    needs: a1-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            target: default
          - api: 34
            target: google_apis
    env:
      ASAN_OPTIONS: detect_leaks=0
      CHARCOAL_GREASE: ${{ github.workspace }}/grease/_bin/cxx-asan/ysh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/ai-ci
          ref: 3e7a512fd68e299491bac8b40f2e199875b62008
          path: independent-presentation
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: emulator-convergence-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          merge-multiple: true
          github-token: ${{ github.token }}
          path: grease
      - run: chmod +x grease/_bin/cxx-asan/ysh
      - run: echo '7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c  grease/_bin/cxx-asan/ysh' | sha256sum -c -
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y ripgrep ffmpeg
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'build-tools;34.0.0 platforms;android-34'
      - name: Pinned independent bytecode assembler
        run: curl --fail --location https://github.com/baksmali/smali/releases/download/3.0.10/smali-3.0.10-fat-release.jar -o smali.jar
      - run: echo '32fa0e88a6c397b3922201adf5f3e534fbaed5a663c71d0c558c3ddce0af844a  smali.jar' | sha256sum -c -
      - name: Inspect actual signed candidate before Android execution
        run: >
          grease/_bin/cxx-asan/ysh independent-presentation/examples/autogenerated/native-presentation/verify-fastchat-input.grease
          "$GITHUB_WORKSPACE/candidate/fastchat.apk" "${{ github.event.pull_request.head.sha || github.sha }}"
          "$ANDROID_HOME" "$RUNNER_TEMP/fastchat-input"
      - name: Build independent Android observer with the declared public test signer
        run: >
          grease/_bin/cxx-asan/ysh independent-presentation/examples/autogenerated/native-presentation/prepare-fastchat.grease
          "$GITHUB_WORKSPACE/independent-presentation" "$GITHUB_WORKSPACE" "$ANDROID_HOME"
          "$GITHUB_WORKSPACE/smali.jar" "$GITHUB_WORKSPACE/android/signing/fastchat-comparison-dev.jks" "$RUNNER_TEMP/fastchat-observer"
      - run: sudo chmod 666 /dev/kvm
      - name: Exercise real framework controls and durable conversation on ART
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          disable-animations: true
          script: >
            grease/_bin/cxx-asan/ysh independent-presentation/examples/autogenerated/native-presentation/observe-fastchat.grease
            "$ANDROID_HOME/platform-tools/adb" emulator-5554 "$GITHUB_WORKSPACE/candidate/fastchat.apk"
            "$RUNNER_TEMP/fastchat-observer" "$RUNNER_TEMP/fastchat-UI" "${{ matrix.api }}" required-timeline
      - name: Retain independent Android receipts and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-ui-API${{ matrix.api }}-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/fastchat-input
            ${{ runner.temp }}/fastchat-observer
            ${{ runner.temp }}/fastchat-UI
