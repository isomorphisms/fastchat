name: FastChat A1 native producer
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  a1-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - name: Exact FastChat source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Qualified owned A1 ICK compiler
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/ick
          run-id: 37580514958
          artifact-ids: 11464479465
          merge-multiple: true
          github-token: ${{ github.token }}
          path: compiler
      - name: Exact Grease producer runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 37476471876
          artifact-ids: 11419782646
          merge-multiple: true
          github-token: ${{ github.token }}
          path: grease
      - name: Artifact executable permissions
        run: chmod +x compiler/xgcc compiler/cc1 compiler/collect2 grease/_bin/cxx-asan/ysh
      - name: Producer search-tool package metadata
        run: sudo apt-get update
      - name: Producer recipe dependency
        run: sudo apt-get install -y ripgrep
      - name: Grease producer identity
        run: sha256sum grease/_bin/cxx-asan/ysh
      - name: ASAN producer mapping compatibility
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Producer Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: ''
      - name: Pinned producer NDK
        run: sdkmanager 'ndk;29.0.14206865'
      - name: Compile all C through ICK; NDK assembly and platform link
        run: >
          grease/_bin/cxx-asan/ysh scripts/build-a1-native.grease
          compiler/xgcc compiler "$ANDROID_HOME/ndk/29.0.14206865" a1-native
          "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Preserve stripped native payload and exact producer receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: a1-native-c-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            a1-native/libfastchat.so
            a1-native/sha256.txt
            a1-native/sizes.txt
            a1-native/source.tsv
            a1-native/elf.txt
            a1-native/imports.txt
          if-no-files-found: error
