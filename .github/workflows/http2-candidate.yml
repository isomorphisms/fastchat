name: FastChat HTTP2 candidate qualification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  provider-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - name: Exact candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Qualified division-capable C producer
        id: ick
        uses: isomorphisms/ai-ci/ick-host@015cc7901ae0b3ad262b476f24e129b53c56db95
      - name: Locate the exact C frontend
        run: echo "ICK_SUPPORT=$(dirname "$("${{ steps.ick.outputs.compiler }}" -print-prog-name=cc1)")" >> "$GITHUB_ENV"
      - name: Exact Grease runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 37478624499
          artifact-ids: 11419719229
          github-token: ${{ github.token }}
          merge-multiple: true
          path: grease
      - name: Compiler and runtime identities
        run: |
          chmod +x grease/_bin/cxx-asan/ysh
          echo '7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c  grease/_bin/cxx-asan/ysh' | sha256sum -c -
          sudo sysctl vm.mmap_rnd_bits=28
      - name: Foreign build generator
        run: python3 -m pip install cmake==4.4.0
      - name: Pinned NDK archive tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: ''
      - name: NDK r29
        run: sdkmanager 'ndk;29.0.14206865'
      - name: Exact upstream HTTP2 sources
        run: grease/_bin/cxx-asan/ysh _/transport/fetch.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/http2-sources" 2
      - name: Foreign library C through ICK
        run: >
          grease/_bin/cxx-asan/ysh scripts/build-http2-libraries.grease
          "$GITHUB_WORKSPACE/http2-sources" "$GITHUB_WORKSPACE/http2" "$ANDROID_HOME/ndk/29.0.14206865" host "$(command -v cmake)"
          "${{ steps.ick.outputs.compiler }}" "${{ env.ICK_SUPPORT }}"
      - name: Maintained native boundary through ICK
        run: >
          grease/_bin/cxx-asan/ysh scripts/test-http2.grease
          "${{ steps.ick.outputs.compiler }}" "${{ env.ICK_SUPPORT }}"
          "$GITHUB_WORKSPACE/http2/prefix" "$GITHUB_WORKSPACE/http2-tests"
          ${{ steps.ick.outputs.link_flags }}
      - name: Compile and link the retained standalone probe through ICK
        run: >
          make -f _/transport/OwnedC.mk
          ROOT="$GITHUB_WORKSPACE" OUTPUT="$GITHUB_WORKSPACE/http2"
          NDK="$ANDROID_HOME/ndk/29.0.14206865"
          ICK="${{ steps.ick.outputs.compiler }}"
      - name: Local deterministic TLS and production event qualification
        run: node examples/autogenerated/http-transport/qualify.js "$GITHUB_WORKSPACE/http2-tests" candidate "$GITHUB_WORKSPACE/qualification-http2"
      - name: Bound qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: http2-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: |
            http2-tests
            qualification-http2/boundary.log
            qualification-http2/fixture.tsv
            http2/foreign-compiler.txt
            http2/foreign-digests.txt
