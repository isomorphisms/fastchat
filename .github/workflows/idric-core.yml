name: Idriç conversation core
permissions:
  contents: read
  actions: read

on:
  pull_request:
  push:

concurrency:
  group: idric-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-semantics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FastChat
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: fastchat
          persist-credentials: false

      - name: Checkout pinned Idriç compiler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: isomorphisms/Idric
          ref: ff4d852862a3942592f8ade9afde8d409d9803be
          path: Idric
          persist-credentials: false

      - name: Bootstrap pinned Idriç
        working-directory: Idric
        run: ./edric bootstrap

      - name: Verified Grease runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 37478624499
          artifact-ids: 11419719229
          github-token: ${{ github.token }}
          merge-multiple: true
          path: grease
      - name: Grease identity and file mode
        run: |
          chmod +x grease/_bin/cxx-asan/ysh
          echo '7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c  grease/_bin/cxx-asan/ysh' | sha256sum -c -
          sudo sysctl vm.mmap_rnd_bits=28

      - name: Stage FastChat sources in the Idriç acceptance harness
        run: env ASAN_OPTIONS=detect_leaks=0 grease/_bin/cxx-asan/ysh fastchat/scripts/stage-idric.grease "$GITHUB_WORKSPACE/Idric"

      - name: Typecheck and execute semantic fixtures
        working-directory: Idric
        run: ./edric test --only idris2/basic/fastchat-core
