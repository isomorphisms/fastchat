name: Qualified HTTP/2 division source producer
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: [host, a1]
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 37478624499
          artifact-ids: 11419719229
          github-token: ${{ github.token }}
          merge-multiple: true
          path: grease
      - name: Exact Grease and original build prerequisites
        run: |
          chmod +x grease/_bin/cxx-asan/ysh
          echo '7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c  grease/_bin/cxx-asan/ysh' | sha256sum -c -
          sudo sysctl vm.mmap_rnd_bits=28
          sudo apt-get update
          sudo apt-get install -y build-essential perl ripgrep
          python3 -m pip install cmake==4.4.4
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
      - name: Original exact NDK
        run: sdkmanager 'ndk;29.0.14206865'
      - name: Qualified host C frontend
        if: matrix.platform == 'host'
        id: ick-host
        uses: isomorphisms/ai-ci/ick-host@015cc7901ae0b3ad262b476f24e129b53c56db95
      - name: Qualified ARM C frontend
        if: matrix.platform == 'a1'
        id: ick-arm
        uses: isomorphisms/ai-ci/ick-android@015cc7901ae0b3ad262b476f24e129b53c56db95
        with:
          abi: armeabi-v7a
          ndk: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
      - name: Exact external library sources and complete policy patch
        run: grease/_bin/cxx-asan/ysh _/transport/fetch.grease "$GITHUB_WORKSPACE" "$RUNNER_TEMP/sources" 2
      - name: Original libraries and explicit maintained ICK source stage
        env:
          ICK: ${{ steps.ick-host.outputs.compiler || steps.ick-arm.outputs.compiler }}
        run: >
          grease/_bin/cxx-asan/ysh _/transport/build.grease
          "$GITHUB_WORKSPACE" "$RUNNER_TEMP/sources" "$RUNNER_TEMP/native"
          "$ANDROID_HOME/ndk/29.0.14206865" ${{ matrix.platform }} 2 "$(command -v cmake)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: matrix.platform == 'host'
        with:
          node-version: '24.19.0'
      - name: Existing native framing and protocol suite
        if: matrix.platform == 'host'
        env:
          ICK: ${{ steps.ick-host.outputs.compiler }}
        run: |
          make -f _/transport/OwnedC.mk framing ROOT="$GITHUB_WORKSPACE" OUTPUT="$RUNNER_TEMP/native" NDK="$ANDROID_HOME/ndk/29.0.14206865" ICK="$ICK" PROTOCOL=2
          node examples/autogenerated/http-transport/qualify.js "$RUNNER_TEMP/native/fastchat-transport-probe" 2 "$RUNNER_TEMP/protocol" "unused"
      - name: Retain actual source, assembly, ELF and protocol evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: http2-${{ matrix.platform }}-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/native/owned-c/
            ${{ runner.temp }}/native/libfastchat_transport.so
            ${{ runner.temp }}/native/fastchat-transport-probe
            ${{ runner.temp }}/native/*-build.log
            ${{ runner.temp }}/native/*-configure.log
            ${{ runner.temp }}/native/artifacts.sha256
            ${{ runner.temp }}/native/compiler.txt
            ${{ runner.temp }}/native/elf.txt
            ${{ runner.temp }}/native/*.relocations
            ${{ runner.temp }}/sources/*.patch
            ${{ runner.temp }}/protocol/
