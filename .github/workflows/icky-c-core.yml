name: FastChat Icky core
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Exact FastChat head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Pinned ICK and immutable GCC reference
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: dilapidated-shed/ick
          ref: 515c0f29fe6e2e96e10495fbaf25da93532e7722
          path: compiler
          submodules: true
          persist-credentials: false
      - name: Pinned Icky Lua runtime
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/lua
          ref: 87306483cec50f8c750a22dda1d0742246fad756
          path: icky-lua
          persist-credentials: false
      - name: Shared build-toolchain contract
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: isomorphisms/ai-ci
          ref: 8bf8be153f792c4def251287ed85543d1fe24f07
          path: contract
          persist-credentials: false
      - name: Refresh producer package metadata
        run: sudo apt-get update
      - name: Compiler bootstrap dependencies
        run: sudo apt-get install -y build-essential flex bison texinfo libgmp-dev libmpfr-dev libmpc-dev libisl-dev libzstd-dev
      - name: Materialize owned ICK
        working-directory: compiler
        run: bash ick/materialize.sh gcc source
      - name: Build directory
        run: mkdir -p compiler/build
      - name: Configure host compiler
        working-directory: compiler/build
        run: >
          ../source/configure --target=x86_64-linux-gnu
          --with-as=/usr/bin/as --with-ld=/usr/bin/ld
          --enable-languages=c --disable-bootstrap --disable-multilib
          --disable-nls --disable-shared --disable-threads --without-headers
          --disable-libatomic --disable-libgomp --disable-libquadmath
          --disable-libssp --disable-libvtv --disable-libsanitizer
      - name: Restore exact compiler
        id: compiler-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          key: ick-host-ubuntu24-c-only-515c0f29fe6e2e96e10495fbaf25da93532e7722-v1
          path: |
            compiler/build/gcc/xgcc
            compiler/build/gcc/cc1
            compiler/build/gcc/collect2
            compiler/build/gcc/include
            compiler/build/gcc/include-fixed
      - name: Build ICK (system GCC bootstraps only)
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        run: make -C compiler/build -j2 all-gcc
      - name: Compile shared verifier through ICK
        run: >
          compiler/build/gcc/xgcc -Bcompiler/build/gcc/
          -B/usr/lib/gcc/x86_64-linux-gnu/13/
          -isystem /usr/lib/gcc/x86_64-linux-gnu/13/include
          -std=c11 -O2 contract/src/aici.c -o contract-check
      - name: Required shared toolchain contract
        run: ./contract-check verify contract/contracts/build-toolchain-v0.contract.tsv .
      - name: Compile actual Icky Lua runtime through ICK
        run: >
          compiler/build/gcc/xgcc -Bcompiler/build/gcc/
          -B/usr/lib/gcc/x86_64-linux-gnu/13/
          -isystem /usr/lib/gcc/x86_64-linux-gnu/13/include
          -std=c11 -O2 -DMAKE_LIB -DLUA_USE_POSIX
          -ffunction-sections -fdata-sections -Iicky-lua
          -c icky-lua/onelua.c -o icky-lua.o
      - name: Compile actual arrow C
        run: >
          compiler/build/gcc/xgcc -Bcompiler/build/gcc/
          -B/usr/lib/gcc/x86_64-linux-gnu/13/
          -isystem /usr/lib/gcc/x86_64-linux-gnu/13/include
          -std=c11 -D_FILE_OFFSET_BITS=64 -DFC_FAULT_TESTING -O2 -Wall -Wextra -Werror
          -Isrc -Ithird-party/appendfat-arena -Iicky-lua -DFC_POLICY_SOURCE='"policy/composition.lua"'
          -ffunction-sections -fdata-sections
          src/conversation.c src/render_policy.c src/fixture_transport.c src/provider.c
          transport/native/sse.c
          third-party/appendfat-arena/appendfat_arena.c
          tests/conversation.c icky-lua.o -Wl,--gc-sections -lm -ldl -o core-tests
      - name: Deterministic fault, transport and replay suite
        run: ./core-tests
      - name: Exact Grease for hostile mutations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 37478624499
          artifact-ids: 11419719229
          github-token: ${{ github.token }}
          merge-multiple: true
          path: grease
      - name: Verify and prepare Grease
        run: |
          chmod +x grease/_bin/cxx-asan/ysh
          echo '7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c  grease/_bin/cxx-asan/ysh' | sha256sum -c -
          sudo sysctl vm.mmap_rnd_bits=28
      - name: Targeted retry, response barrier and response checksum mutations
        run: >
          env ASAN_OPTIONS=detect_leaks=0 FC_GREASE="$GITHUB_WORKSPACE/grease/_bin/cxx-asan/ysh"
          grease/_bin/cxx-asan/ysh scripts/mutation-core.grease
          "$GITHUB_WORKSPACE/compiler/build/gcc/xgcc" "$GITHUB_WORKSPACE/compiler/build/gcc"
          "$GITHUB_WORKSPACE/icky-lua" "$GITHUB_WORKSPACE/mutations"
          -B/usr/lib/gcc/x86_64-linux-gnu/13/ -isystem /usr/lib/gcc/x86_64-linux-gnu/13/include
      - name: Branch measurement
        run: ./core-tests benchmark "$(cat ci/renderer-mode)" benchmark-store
      - name: Fresh-process completed replay
        run: ./core-tests replay benchmark-store
      - name: RAM control in separate process
        run: ./core-tests benchmark ram unused
      - name: Canonical corpus
        run: ./core-tests corpus corpus-store
      - name: Preserve exact compiler and test evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            core-tests
            corpus-store
            benchmark-store
            compiler/build/gcc/xgcc
            compiler/build/gcc/cc1
            compiler/build/gcc/collect2
